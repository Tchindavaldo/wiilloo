<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Payment - Mobile Money</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "text-light": "#333333",
                        "text-dark": "#f1f1f1",
                        "border-light": "#dbe0e6",
                        "border-dark": "#3a444c",
                        "input-bg-light": "#ffffff",
                        "input-bg-dark": "#1a242d",
                        "placeholder-light": "#617589",
                        "placeholder-dark": "#9ab0c4",
                        "secondary-bg-light": "#f0f2f4",
                        "secondary-bg-dark": "#2c3843",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="font-display">
    <div
        class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
       
        <main class="flex-1 pb-24">
            <div class="flex flex-col gap-6 p-4">
                <div class="flex items-center gap-4">
                    <span
                        class="material-symbols-outlined text-2xl text-text-light dark:text-text-dark">smartphone</span>
                    <h2 class="text-base font-semibold text-text-light dark:text-text-dark">Mobile Money Payment</h2>
                </div>
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-medium text-text-light dark:text-text-dark mb-1"
                            for="momo-phone">Mobile Money Phone Number</label>
                        <input
                            class="w-full rounded-lg border border-border-light bg-input-bg-light p-3 text-text-light placeholder-placeholder-light focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-input-bg-dark dark:text-text-dark dark:placeholder-placeholder-dark"
                            id="momo-phone" name="momo-phone" placeholder="Enter your phone number" type="tel" />
                    </div>
                    <div class="rounded-lg bg-secondary-bg-light p-4 text-center dark:bg-secondary-bg-dark">
                        <p class="text-sm text-placeholder-light dark:text-placeholder-dark">
                            Once you enter your number and confirm, please dial <span
                                class="font-semibold text-text-light dark:text-text-dark">*126#</span> and follow the
                            prompts on your phone to complete the payment.
                        </p>
                    </div>
                </div>
            </div>
        </main>
        <footer
            class="fixed bottom-0 left-0 z-10 w-full border-t border-border-light bg-background-light p-4 dark:border-border-dark dark:bg-background-dark">
            <div class="flex gap-4">
                <button
                    class="flex h-12 flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-lg border border-border-light bg-background-light px-6 text-base font-bold text-text-light shadow-sm transition-all hover:bg-opacity-90 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50 dark:border-border-dark dark:bg-background-dark dark:text-text-dark">
                    <span class="truncate">Previous</span>
                </button>
                <button
                    class="flex h-12 flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary px-6 text-base font-bold text-white shadow-sm transition-all hover:bg-opacity-90 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50">
                    <span class="truncate">Confirm</span>
                </button>
            </div>
        </footer>
    </div>

</body>

</html>
