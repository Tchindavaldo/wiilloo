<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create Proof - Step 1</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4A90E2",
                        "background-light": "#F7F8FC",
                        "background-dark": "#1a1c23",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#2a2d35",
                        "text-light": "#333333",
                        "text-dark": "#EAEAEA",
                        "border-light": "#E0E0E0",
                        "border-dark": "#40444C",
                        "placeholder-light": "#A0A0A0",
                        "placeholder-dark": "#787A80",
                        "secondary": "#F5A623",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom styles for toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #E0E0E0;
            transition: .4s;
            border-radius: 24px;
        }

        .dark .slider {
            background-color: #40444C;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4A90E2;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
    <div
        class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
        <!-- Top App Bar -->
        <div
            class="sticky top-0 z-10 flex items-center bg-surface-light dark:bg-surface-dark p-4 border-b border-border-light dark:border-border-dark">
            <div class="text-text-light dark:text-text-dark flex size-10 shrink-0 items-center justify-center">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </div>
            <h1 class="text-lg font-bold flex-1 text-center pr-10">Create Proof (1/3)</h1>
        </div>
        <!-- Page Indicators -->
        <div
            class="flex w-full flex-row items-center justify-center gap-3 py-5 px-4 bg-surface-light dark:bg-surface-dark">
            <div class="flex-1 h-1 rounded-full bg-primary"></div>
            <div class="flex-1 h-1 rounded-full bg-border-light dark:bg-border-dark"></div>
            <div class="flex-1 h-1 rounded-full bg-border-light dark:bg-border-dark"></div>
        </div>
        <div class="flex-grow flex flex-col p-4">
            <!-- Section Header -->
            <h2 class="text-lg font-bold leading-tight tracking-[-0.015em] pt-2 pb-4">Basic Information</h2>
            <!-- Form Fields -->
            <div class="space-y-4">
                <!-- Proof Title -->
                <label class="flex flex-col w-full">
                    <p class="text-base font-medium leading-normal pb-2">Proof Title*</p>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark h-14 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal"
                        placeholder="e.g., Mid-term Exam, 2024" value="" />
                </label>
                <!-- Level -->
                <label class="flex flex-col w-full">
                    <p class="text-base font-medium leading-normal pb-2">Level*</p>
                    <select
                        class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark h-14 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal"
                        style="background-image: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27none%27 viewBox=%270 0 20 20%27%3e%3cpath stroke=%27%236b7280%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke-width=%271.5%27 d=%27m6 8 4 4 4-4%27/%3e%3c/svg%3e'); background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em;">
                        <option disabled="" selected="" value="">Select level</option>
                        <option value="high_school">High School</option>
                        <option value="undergraduate">Undergraduate</option>
                        <option value="graduate">Graduate</option>
                    </select>
                </label>
                <!-- Class -->
                <label class="flex flex-col w-full">
                    <p class="text-base font-medium leading-normal pb-2">Class*</p>
                    <select
                        class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark h-14 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal"
                        style="background-image: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27none%27 viewBox=%270 0 20 20%27%3e%3cpath stroke=%27%236b7280%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke-width=%271.5%27 d=%27m6 8 4 4 4-4%27/%3e%3c/svg%3e'); background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em;">
                        <option disabled="" selected="" value="">Select class</option>
                        <option value="class_10">Class 10</option>
                        <option value="class_11">Class 11</option>
                        <option value="class_12">Class 12</option>
                    </select>
                </label>
                <!-- Field -->
                <label class="flex flex-col w-full">
                    <p class="text-base font-medium leading-normal pb-2">Field</p>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark h-14 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal"
                        placeholder="e.g., Mathematics" value="" />
                </label>
                <!-- School -->
                <label class="flex flex-col w-full">
                    <p class="text-base font-medium leading-normal pb-2">School</p>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark h-14 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal"
                        placeholder="e.g., Central High School" value="" />
                </label>
                <!-- Has Correction Toggle -->
                <div
                    class="flex items-center justify-between bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark">
                    <p class="text-base font-medium leading-normal flex-1">This is a correction of a previous proof</p>
                    <label class="switch">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        <!-- Footer Navigation -->
        <div
            class="sticky bottom-0 z-10 mt-auto bg-surface-light dark:bg-surface-dark p-4 border-t border-border-light dark:border-border-dark">
            <div class="flex w-full items-center gap-4">
                <button
                    class="flex-1 text-center font-bold text-primary dark:text-primary h-14 px-6 rounded-lg border-2 border-primary dark:border-primary transition-colors duration-200">Back</button>
                <button
                    class="flex-1 text-center font-bold text-white bg-primary dark:bg-primary h-14 px-6 rounded-lg transition-colors duration-200 hover:bg-primary/90">Next</button>
            </div>
        </div>
    </div>
</body>

</html>
