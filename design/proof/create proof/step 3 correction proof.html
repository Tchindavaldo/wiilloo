<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create Proof - Step 2</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4A90E2",
                        "background-light": "#F7F8FC",
                        "background-dark": "#1a1c23",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#2a2d35",
                        "text-light": "#333333",
                        "text-dark": "#EAEAEA",
                        "border-light": "#E0E0E0",
                        "border-dark": "#40444C",
                        "placeholder-light": "#A0A0A0",
                        "placeholder-dark": "#787A80",
                        "secondary": "#F5A623",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #E0E0E0;
            transition: .4s;
            border-radius: 24px;
        }

        .dark .slider {
            background-color: #40444C;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4A90E2;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .scroll-snap-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .scroll-snap-container::-webkit-scrollbar {
            display: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
    <div
        class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
        <div
            class="sticky top-0 z-10 flex items-center bg-surface-light dark:bg-surface-dark p-4 border-b border-border-light dark:border-border-dark">
            <div class="text-text-light dark:text-text-dark flex size-10 shrink-0 items-center justify-center">
                <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
            </div>
            <h1 class="text-lg font-bold flex-1 text-center pr-10">Create Proof</h1>
        </div>
        <div
            class="flex w-full flex-row items-center justify-center gap-3 py-5 px-4 bg-surface-light dark:bg-surface-dark shadow-sm">
            <div class="flex flex-col items-center flex-1">
                <div class="flex items-center justify-center size-8 rounded-full bg-primary text-white font-bold mb-2">
                    <span class="material-symbols-outlined text-xl">check</span>
                </div>
                <p class="text-xs font-semibold text-primary">Basic Information</p>
            </div>
            <div class="h-px flex-1 bg-primary -mt-7"></div>
            <div class="flex flex-col items-center flex-1">
                <div class="flex items-center justify-center size-8 rounded-full bg-primary text-white font-bold mb-2">2
                </div>
                <p class="text-xs font-semibold text-primary">Correction Details</p>
            </div>
            <div class="h-px flex-1 bg-border-light dark:bg-border-dark -mt-7"></div>
            <div class="flex flex-col items-center flex-1">
                <div
                    class="flex items-center justify-center size-8 rounded-full bg-border-light dark:bg-border-dark text-text-light dark:text-text-dark font-bold mb-2">
                    3</div>
                <p class="text-xs text-placeholder-light dark:text-placeholder-dark">Proof Images</p>
            </div>
        </div>
        <div class="flex flex-grow flex-col">
            <div
                class="w-full overflow-x-auto border-b border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark">
                <div class="flex flex-nowrap items-center p-4 gap-4">
                    <button
                        class="shrink-0 whitespace-nowrap px-4 py-2 text-sm font-semibold rounded-full bg-primary text-white">Correction
                        1</button>
                    <button
                        class="shrink-0 whitespace-nowrap px-4 py-2 text-sm font-semibold rounded-full bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">Correction
                        2</button>
                    <button
                        class="flex shrink-0 items-center justify-center size-10 rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                </div>
            </div>
            <div class="flex-grow p-4">
                <div
                    class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark space-y-4">
                    <label class="flex flex-col w-full">
                        <p class="text-sm font-medium leading-normal pb-2 text-text-light dark:text-text-dark/80">
                            Corrector Name</p>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-12 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark px-4 text-base font-normal leading-normal"
                            placeholder="e.g. John Doe" value="" />
                    </label>
                    <label class="flex flex-col w-full">
                        <p class="text-sm font-medium leading-normal pb-2 text-text-light dark:text-text-dark/80">
                            Correction Year</p>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-12 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark px-4 text-base font-normal leading-normal"
                            placeholder="e.g. 2023" value="" />
                    </label>
                    <label class="flex flex-col w-full">
                        <p class="text-sm font-medium leading-normal pb-2 text-text-light dark:text-text-dark/80">
                            Correction Level</p>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-12 placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark px-4 text-base font-normal leading-normal"
                            placeholder="e.g. Minor" value="" />
                    </label>
                    <div
                        class="flex flex-col items-center justify-center w-full gap-2 p-6 text-center font-semibold text-primary bg-primary/10 dark:bg-primary/20 h-32 rounded-lg transition-colors duration-200 hover:bg-primary/20 dark:hover:bg-primary/30 border-2 border-dashed border-primary/50 cursor-pointer">
                        <span class="material-symbols-outlined text-4xl">cloud_upload</span>
                        <span>Upload Correction Image</span>
                    </div>
                </div>
            </div>
        </div>
        <div
            class="sticky bottom-0 z-10 mt-auto bg-surface-light dark:bg-surface-dark p-4 border-t border-border-light dark:border-border-dark">
            <div class="flex w-full items-center gap-4">
                <button
                    class="w-full text-center font-bold text-primary bg-transparent border-2 border-primary h-12 px-6 rounded-lg transition-colors duration-200 hover:bg-primary/10">Previous</button>
                <button
                    class="w-full text-center font-bold text-white bg-primary dark:bg-primary h-12 px-6 rounded-lg transition-colors duration-200 hover:bg-primary/90">Next</button>
            </div>
        </div>
    </div>

</body>

</html>
